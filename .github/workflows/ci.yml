name: CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: ruff check .
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  standalone:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install . pyinstaller
      - run: pyinstaller --onefile --name brakesmith src/brakesmith/__main__.py
      - uses: actions/upload-artifact@v4
        with:
          name: brakesmith-${{ runner.os }}-${{ runner.arch }}
          path: dist/brakesmith*
  handbrake-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg handbrake-cli
      - run: python -m pip install .
      - name: Create fixture and encode it
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=160x90:rate=12:duration=1 -f lavfi -i sine=duration=1 -map 0:v -map 1:a -c:v libx264 -c:a aac -metadata:s:a:0 language=eng fixture.mkv
          brakesmith run . --no-keep-original --unknown-audio drop --unknown-subtitles drop --quality 30 --preset ultrafast --yes
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1 fixture.brakesmith.mkv | grep codec_name=hevc
