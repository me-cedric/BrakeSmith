name: Desktop

on:
  push:
    paths:
      - "desktop/**"
      - "src/brakesmith/**"
      - "pyproject.toml"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "src/brakesmith/**"
      - "pyproject.toml"
      - ".github/workflows/desktop.yml"

jobs:
  desktop:
    name: ${{ matrix.platform }} desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install Linux desktop libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Build BrakeSmith sidecar
        run: |
          python -m pip install . pyinstaller
          pyinstaller --onefile --name brakesmith src/brakesmith/__main__.py
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Prepare target sidecar
        working-directory: desktop
        run: npm run sidecar
      - name: Test interface
        working-directory: desktop
        run: npm test
      - name: Check frontend build
        working-directory: desktop
        run: npm run build
      - name: Check Rust formatting
        working-directory: desktop
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Check native code
        working-directory: desktop
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Test native code
        working-directory: desktop
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build unsigned desktop bundle
        working-directory: desktop
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: brakesmith-desktop-${{ matrix.platform }}-${{ runner.arch }}
          path: desktop/src-tauri/target/release/bundle/
          if-no-files-found: error
