[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brakesmith"
version = "0.2.0"
description = "Safety-first batch H.265 transcoding with HandBrakeCLI"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Cedric Meyer" }]
keywords = ["handbrake", "h265", "hevc", "x265", "transcoding", "video", "batch", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]
dependencies = ["rich>=13.7", "typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
brakesmith = "brakesmith.cli:app"

[project.urls]
Homepage = "https://github.com/me-cedric/BrakeSmith"
Issues = "https://github.com/me-cedric/BrakeSmith/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/brakesmith"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
extend-ignore = ["B008", "UP045"]
